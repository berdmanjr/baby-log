<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Baby Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Baby Log</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app. Sticky header, scrolling view, fixed bottom tabs, bottom-sheet forms. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E7ECEA; --ink:#17201E; --muted:#5A6864; --line:#D6DDDA;
  --accent:#2E4F8F; --accent-ink:#FFFFFF; --danger:#B3261E; --warn-bg:#FFF4D6; --warn-ink:#6B4E00;
  --diaper:#B47D14; --feed:#2C77B8; --pump:#7E55B8; --sleep:#3B4A9A; --tummy:#2F8A5C; --visit:#B8455F; --growth:#16807F; --spitup:#C4622D;
  --wet:#3C8DD3; --dirty:#8F5E2E; --formula:#79B4DF;
  --ok:#2F7D4F; --watch:#9A6200; --alert:#B3261E;
  --f-display:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; --tabh:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#171F1D; --surface-2:#212B28; --ink:#E6EDEA; --muted:#9AA8A4; --line:#2C3834;
  --accent:#8FB0F0; --accent-ink:#0E1412; --danger:#F2867E; --warn-bg:#3A3018; --warn-ink:#F3D58A;
  --diaper:#E0B04D; --feed:#6AAEE8; --pump:#B595E6; --sleep:#9AA6F0; --tummy:#6CCB97; --visit:#EE8AA1; --growth:#5CC9C6; --spitup:#F09A66;
  --wet:#6FB2EE; --dirty:#C8955F; --formula:#A9D3F2; color-scheme:dark;
  --ok:#6CCB97; --watch:#E9B949; --alert:#F2867E;
}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#171F1D; --surface-2:#212B28; --ink:#E6EDEA; --muted:#9AA8A4; --line:#2C3834;
  --accent:#8FB0F0; --accent-ink:#0E1412; --danger:#F2867E; --warn-bg:#3A3018; --warn-ink:#F3D58A;
  --diaper:#E0B04D; --feed:#6AAEE8; --pump:#B595E6; --sleep:#9AA6F0; --tummy:#6CCB97; --visit:#EE8AA1; --growth:#5CC9C6; --spitup:#F09A66;
  --wet:#6FB2EE; --dirty:#C8955F; --formula:#A9D3F2; color-scheme:dark;
  --ok:#6CCB97; --watch:#E9B949; --alert:#F2867E;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px 8px}
.who{flex:1;min-width:0}
.who h1{font-family:var(--f-display);font-size:24px;line-height:1.1;margin:0;letter-spacing:-.01em}
.who p{margin:2px 0 0;color:var(--muted);font-size:13px}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.banner{margin:4px 0 8px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:13.5px}
main{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
section.view{display:flex;flex-direction:column;gap:14px;padding-top:4px}
h2{font-family:var(--f-display);font-size:18px;margin:0;letter-spacing:-.005em}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}

/* status strip */
.status{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 10px;min-width:0}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:500}
.stat .v{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timers{display:flex;flex-direction:column;gap:8px}
.timer{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.timer .t{flex:1;min-width:0;font-weight:600}
.timer .el{font-family:var(--f-display);font-size:20px}
.timer button{border:0;border-radius:10px;padding:8px 12px;background:var(--c);color:var(--surface);font-weight:600}

/* quick add */
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px 10px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));background:color-mix(in srgb,var(--c) 9%,var(--surface));font-size:12.5px;font-weight:600;color:var(--ink)}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--c);color:var(--surface)}
.qa .ic svg{width:22px;height:22px}
.qa:active{transform:scale(.97)}
.qa[disabled]{opacity:.45}

/* day nav + list */
.daynav{display:flex;align-items:center;gap:8px}
.daynav .lbl{flex:1;text-align:center}
.daynav .lbl b{display:block;font-family:var(--f-display);font-size:17px}
.daynav .lbl span{font-size:12.5px;color:var(--muted)}
.navbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.navbtn[disabled]{opacity:.35}
.daysum{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12.5px;padding:4px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill b{font-weight:600}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;width:100%}
.row:first-child{border-top:0}
.row .dot{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:var(--c)}
.row .dot svg{width:18px;height:18px}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600}
.row .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.row .when{flex:none;text-align:right;font-weight:600;font-size:14px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(3,1fr);height:var(--tabh)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* segmented */
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

/* trends */
.trendbar{display:flex;flex-direction:column;gap:10px}
.chart{display:flex;flex-direction:column;gap:8px}
.chart .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.chart .hd .avg{font-size:12.5px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{fill:var(--muted);font-family:var(--f-body);font-size:10px}
.chart svg text.val{fill:var(--ink);font-weight:600}
.chart svg .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* health check */
.hc .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hc .ctx{font-size:12.5px;color:var(--muted);margin-top:2px}
.hc .verdict{margin:10px 0 4px;padding:9px 12px;border-radius:10px;font-size:14px;font-weight:600;color:var(--lc);background:color-mix(in srgb,var(--lc) 12%,transparent)}
.hc details.hr{border-top:1px solid var(--line)}
.hc details.hr summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 10px;align-items:center;padding:10px 0;cursor:pointer}
.hc details.hr summary::-webkit-details-marker{display:none}
.hc .lvl{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap;color:var(--lc);background:color-mix(in srgb,var(--lc) 14%,transparent);justify-self:start}
.hc .nm{font-weight:600;font-size:14.5px;min-width:0}
.hc .val{font-size:13px;color:var(--muted);text-align:right}
.hc .why{grid-column:1/4;font-size:13px;line-height:1.4}
.hc .more{font-size:12.5px;line-height:1.45;color:var(--muted);padding:0 0 10px}
.hc .more p{margin:0 0 5px}
.hc .foot{border-top:1px solid var(--line);padding-top:10px;font-size:12px;line-height:1.45;color:var(--muted)}
.hc .foot b{color:var(--ink)}
.hc .foot a{color:var(--accent)}
.hc .foot summary{cursor:pointer;color:var(--accent);margin-top:6px}
.hc .foot ul{margin:6px 0 0;padding-left:18px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
.tile .k i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tile .v{font-family:var(--f-display);font-size:22px;line-height:1.2}
.tile .s{font-size:12px;color:var(--muted)}

/* visit summary */
.vsum{padding:12px 14px}
.vsum .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.vsum .h h2{font-size:17px}
.vsum .asof{font-size:11.5px;color:var(--muted)}
.vsum .baby{font-size:13px;color:var(--muted);margin-top:1px}
.vsum .growth{margin-top:6px;display:flex;flex-direction:column;gap:0;font-size:13.5px}
.vsum .growth b{font-weight:600}
.vsum .growth .sm{font-size:12px;color:var(--muted)}
.vtable{width:100%;border-collapse:collapse;margin-top:4px;font-size:13.5px}
.vtable th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:2px 0 1px}
.vtable th:first-child{text-align:left}
.vtable td{padding:2px 0;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
body.v-visit .top{display:none}
.vtable td:first-child{text-align:left;white-space:normal;color:var(--ink)}
.vtable td:nth-child(2){font-weight:600;padding-left:8px}
.vtable td:nth-child(3){padding-left:8px;color:var(--muted)}
.vtable tr.sec td{border-top:0;padding-top:5px;padding-bottom:0;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--muted))}
.vtable .sm{font-size:11.5px;color:var(--muted);font-weight:400}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.qlist li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.qlist li:first-child{border-top:0}
.qlist button.ck{flex:none;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.qlist button.ck svg{width:14px;height:14px;opacity:0}
.qlist li.done button.ck{background:var(--tummy);border-color:var(--tummy);color:var(--surface)}
.qlist li.done button.ck svg{opacity:1}
.qlist li.done span{text-decoration:line-through;color:var(--muted)}
.addq{display:flex;gap:8px;margin-top:8px}
.addq input{flex:1;min-width:0}

/* buttons, forms */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.danger.arm{background:var(--danger);color:var(--surface)}
.btn[disabled]{opacity:.45}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;padding:4px 0;font-size:14px}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=datetime-local],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.backdrop{position:fixed;inset:0;z-index:40;background:rgb(10 14 13 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.sheet .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet .sh .dot{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:var(--surface)}
.sheet .sh .dot svg{width:20px;height:20px}
.sheet .sh h2{flex:1;font-size:20px}
form.f{display:flex;flex-direction:column;gap:14px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld > span,.fld > label{font-size:13px;font-weight:600;color:var(--muted)}
.fld .hint{font-size:12px;color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.numrow{display:flex;align-items:center;gap:8px}
.numrow input{text-align:center;font-weight:600;font-size:20px;padding:8px}
.numrow .unit{font-weight:600;color:var(--muted);min-width:28px}
.step{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:var(--surface)}
.toggle2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbig{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:18px 10px;font-weight:600;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tbig small{font-weight:500;font-size:12px;color:var(--muted)}
.tbig[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.actions .btn{flex:1}
.err{color:var(--danger);font-size:13.5px;font-weight:500}
.meta{font-size:12px;color:var(--muted)}
.timerline{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px}
.timerline span{flex:1;font-size:13.5px;color:var(--muted)}
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.gate form{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.gate .mark{width:56px;height:56px;border-radius:16px;background:var(--sleep);color:var(--surface);display:grid;place-items:center}
.gate .mark svg{width:30px;height:30px}
.gate h1{font-family:var(--f-display);font-size:28px;margin:0;letter-spacing:-.01em}
.gate p{margin:0;color:var(--muted);font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
</style>
</head>
<body>

<div class="gate" id="gate" hidden>
  <form id="gateForm" novalidate>
    <div class="mark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></div>
    <h1>Baby Log</h1>
    <p>Enter the family passcode. You only need to do this once on each phone.</p>
    <input type="text" id="g-user" name="username" autocomplete="username" value="" hidden>
    <div class="fld"><label for="g-pass">Family passcode</label><input type="password" id="g-pass" name="password" autocomplete="current-password" required></div>
    <div class="fld"><label for="g-who">Your name <span class="hint">shown next to what you log</span></label><input type="text" id="g-who" autocomplete="given-name"></div>
    <div class="err" id="gateErr" hidden></div>
    <button class="btn" id="gateBtn">Open the log</button>
  </form>
</div>

<header class="top"><div class="wrap">
  <div class="who"><h1 id="babyName">&nbsp;</h1><p id="babyAge">&nbsp;</p></div>
  <button class="iconbtn" id="btnSettings" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h9M18 6h2M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15.5" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg></button>
</div></header>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <section class="view" id="view-today"></section>
  <section class="view" id="view-trends" hidden></section>
  <section class="view" id="view-visit" hidden></section>
</main>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button class="tab" data-view="today"><svg class="i" viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Log</button>
  <button class="tab" data-view="trends"><svg class="i" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Trends</button>

/* ---------- stores ---------- */
function dbStore(db) {

    kind: 'db',
    sub(coll, cb, err) { return db.collection(coll).onSnapshot(s => cb(s.docs.map(d => ({...d.data(), id: d.id, _path: coll + '/' + d.id})), s.metadata), err); },

    kind: 'mem', docs,

/* Supabase: one table of JSON documents keyed by path, same shape as above. */
const parentOf = p => p.split('/').slice(0, -1).join('/');
function supaStore(client) {

  async function load(coll) {
    const {data, error} = await client.from('docs').select('path,data').eq('coll', coll);
    if (error) throw error;
    return data;
  }
  async function refresh(coll) {
    const mine = subs.filter(s => s.coll === coll); if (!mine.length) return;
    try {
      const rows = await load(coll);
      for (const s of mine) {
        if (s.path) { const r = rows.find(x => x.path === s.path); s.cb(r ? r.data : null); }
        else s.cb(rows.map(r => ({...r.data, id: r.path.split('/').pop(), _path: r.path})));
      }

  }

    .on('postgres_changes', {event: '*', schema: 'public', table: 'docs'}, payload => {
      const row = payload.new && payload.new.path ? payload.new : payload.old;
      if (row && row.path) refresh(row.coll || parentOf(row.path)); else refreshAll();

    kind: 'supabase',
    sub(coll, cb, err) { subs.push({coll, cb, err}); refresh(coll); return () => {}; },
    subDoc(path, cb, err) { const coll = parentOf(path); subs.push({coll, path, cb, err}); refresh(coll); return () => {}; },

/* ---------- stats ---------- */
function rangeStats(from, to) {
  const st = {wet:0, dirty:0, diapers:0, feeds:0, bottleMl:0, formulaMl:0, bottleFeeds:0, formulaFeeds:0, breastMin:0, breastFeeds:0,
    intervals:[], sleepMin:0, sleeps:0, longestSleep:0, tummyMin:0, tummies:0, pumpMl:0, pumps:0,

    if (e.type === 'sleep') {
      const s = e.at, en = e.at + (e.minutes || 0) * MIN, ov = Math.min(en, to) - Math.max(s, from);
      if (ov > 0) { st.sleepMin += ov / MIN; st.sleeps++; st.longestSleep = Math.max(st.longestSleep, e.minutes || 0); }
      continue;
    }
    if (e.at < from || e.at >= to) continue;
    if (e.type === 'diaper') { st.diapers++; if (e.wet) st.wet++; if (e.dirty) st.dirty++; if (e.dirty && e.watery) st.watery++; }
    else if (e.type === 'feed') {
      st.feeds++;
      if (e.method === 'breast') { st.breastFeeds++; st.breastMin += e.minutes || 0; }

/* ---------- describing events ---------- */

    case 'pump': return {t: `Pumped · ${fmtVol(e.ml)}`, s: e.minutes ? fmtDur(e.minutes) + ' session' : ''};

/* ---------- rendering ---------- */
function age() {
  const b = S.settings.birth; if (!b) return '';
  const bt = new Date(b + 'T00:00').getTime(); const days = Math.floor((sod(Date.now()) - bt) / DAY + 0.5);
  if (!isFinite(days) || days < 0) return '';
  if (days < 14) return `${days} day${days === 1 ? '' : 's'} old`;
  if (days < 84) { const w = Math.floor(days / 7), d = days % 7; return `${w} weeks${d ? ` ${d} day${d === 1 ? '' : 's'}` : ''} old`; }
  const bd = new Date(bt), now = new Date(); let m = (now.getFullYear() - bd.getFullYear()) * 12 + now.getMonth() - bd.getMonth(); if (now.getDate() < bd.getDate()) m--;

}

function renderToday() {
  const el = $('#view-today');
  const lf = lastOf(e => e.type === 'feed'), ld = lastOf(e => e.type === 'diaper'), ls = lastOf(e => e.type === 'sleep');
  const lfD = lf ? describe(lf).t.split(' · ') : null;
  const isToday = S.day === sod(Date.now());
  const dayEvents = [...allEvents().filter(e => e.at >= S.day && e.at < addDays(S.day, 1)),
    ...S.visits.filter(v => v.at >= S.day && v.at < addDays(S.day, 1)).map(v => ({...v, type:'visit'})),
    ...S.growth.filter(g => g.at >= S.day && g.at < addDays(S.day, 1)).map(g => ({...g, type:'growth'}))].sort((a, b) => b.at - a.at);
  const st = rangeStats(S.day, addDays(S.day, 1));
  resolveNames([...new Set(dayEvents.map(e => e.by).filter(Boolean))]);
  const dis = S.readOnly || S.mode === 'unavailable' ? 'disabled' : '';
  const pills = [];
  if (st.feeds) pills.push(`<span class="pill num"><b>${st.feeds}</b> feeds</span>`);
  if (st.intakeMl) pills.push(`<span class="pill num"><b>${fmtVol(st.intakeMl)}</b> bottle/formula</span>`);
  if (st.breastMin) pills.push(`<span class="pill num"><b>${fmtDur(st.breastMin)}</b> breast</span>`);
  if (st.diapers) pills.push(`<span class="pill num"><b>${st.wet}</b> wet · <b>${st.dirty}</b> dirty</span>`);
  if (st.sleepMin) pills.push(`<span class="pill num"><b>${fmtDur(st.sleepMin)}</b> sleep</span>`);
  if (st.tummyMin) pills.push(`<span class="pill num"><b>${fmtDur(st.tummyMin)}</b> tummy</span>`);
  if (st.pumpMl) pills.push(`<span class="pill num"><b>${fmtVol(st.pumpMl)}</b> pumped</span>`);
  if (st.spitups) pills.push(`<span class="pill num"><b>${st.spitups}</b> spit-up${st.spitups === 1 ? '' : 's'}${st.spitL ? ` · <b>${st.spitL}</b> large` : ''}</span>`);

  let listHTML;
  if (!S.loadedOnce && S.mode !== 'unavailable') listHTML = `<div class="empty">Loading the log…</div>`;
  else if (!dayEvents.length) listHTML = `<div class="empty">${isToday ? `Nothing logged yet today. Tap a button above to log ${esc(babyName())}'s first diaper, feed or nap.` : 'Nothing was logged this day.'}</div>`;
  else listHTML = dayEvents.map(e => { const d = describe(e); const t = TYPES[e.type];
    return `<button class="row" data-edit="${esc(e._path)}" data-type="${e.type}" style="--c:var(${t.c})"><span class="dot">${icon(e.type)}</span><span class="main"><span class="ttl">${esc(d.t)}</span>${d.s ? `<div class="sub">${esc(d.s)}</div>` : ''}${e.note ? `<div class="sub">“${esc(e.note)}”</div>` : ''}<div class="sub">Logged ${fmtDate(e.loggedAt, {month:'short', day:'numeric'})}, ${fmtTime(e.loggedAt)}${esc(byName(e.by))}</div></span><span class="when num">${fmtTime(e.at)}</span></button>`; }).join('');

  el.innerHTML = `
    ${timerHTML()}
    <div class="status">
      <div class="stat"><div class="k">Last feed</div><div class="v num">${lf ? fmtAgo(lf.at) : '—'}</div><div class="s">${lf ? esc(lfD.join(' ')) : 'none yet'}</div></div>
      <div class="stat"><div class="k">Last diaper</div><div class="v num">${ld ? fmtAgo(ld.at) : '—'}</div><div class="s">${ld ? (ld.wet && ld.dirty ? 'wet + dirty' : ld.dirty ? 'dirty' : 'wet') : 'none yet'}</div></div>
      <div class="stat"><div class="k">${S.timers && S.timers.sleep ? 'Asleep for' : 'Awake for'}</div><div class="v num">${S.timers && S.timers.sleep ? elapsed(S.timers.sleep.start).replace(':', 'h ') + 'm' : ls ? fmtAgo(ls.at + (ls.minutes || 0) * MIN).replace(' ago', '') : '—'}</div><div class="s">${ls ? 'last nap ' + fmtDur(ls.minutes) : 'no sleep logged'}</div></div>
    </div>
    <div class="quick">
      ${['diaper','feed','sleep','pump','spitup','tummy','growth','visit'].map(k => `<button class="qa" data-add="${k}" style="--c:var(${TYPES[k].c})" ${dis}><span class="ic">${icon(k)}</span>${({visit:'Doctor', growth:'Weight'})[k] || TYPES[k].label}</button>`).join('')}
    </div>
    <div class="daynav">
      <button class="navbtn" data-day="-1" aria-label="Previous day">‹</button>
      <div class="lbl"><b>${isToday ? 'Today' : S.day === addDays(sod(Date.now()), -1) ? 'Yesterday' : fmtDate(S.day, {weekday:'long'})}</b><span>${fmtDate(S.day, {month:'long', day:'numeric', year:'numeric'})}</span></div>
      <button class="navbtn" data-day="1" aria-label="Next day" ${isToday ? 'disabled' : ''}>›</button>
    </div>
    ${pills.length ? `<div class="daysum">${pills.join('')}</div>` : ''}
    <div class="list">${listHTML}</div>`;
}

/* ---------- charts ---------- */
function niceMax(v) { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); for (const m of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }
function barChart({labels, series, grouped = false, fmt = v => fmtN(v), avg = null}) {
  const W = 340, H = 132, padT = 16, padB = 18, n = labels.length, slot = W / n, ch = H - padT - padB;
  const totals = labels.map((_, i) => grouped ? Math.max(...series.map(s => s.values[i] || 0)) : series.reduce((a, s) => a + (s.values[i] || 0), 0));
  const max = niceMax(Math.max(...totals, avg || 0));
  const y = v => padT + ch - (v / max) * ch;
  let g = `<line class="grid" x1="0" x2="${W}" y1="${padT + ch}" y2="${padT + ch}"/>`;
  if (avg) g += `<line x1="0" x2="${W}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>`;
  labels.forEach((lb, i) => {
    const x0 = i * slot, bw = Math.min(34, slot * 0.62);
    if (grouped) {
      const each = bw / series.length;
      series.forEach((s, j) => { const v = s.values[i] || 0; const x = x0 + (slot - bw) / 2 + j * each;
        if (v > 0) g += `<rect x="${x + 1}" y="${y(v)}" width="${each - 2}" height="${padT + ch - y(v)}" rx="3" fill="var(${s.c})"/><text class="val" x="${x + each / 2}" y="${y(v) - 3}" text-anchor="middle">${fmt(v)}</text>`; });
    } else {
      let acc = 0; const x = x0 + (slot - bw) / 2;
      series.forEach(s => { const v = s.values[i] || 0; if (v > 0) { g += `<rect x="${x}" y="${y(acc + v)}" width="${bw}" height="${y(acc) - y(acc + v)}" rx="3" fill="var(${s.c})"/>`; acc += v; } });
      if (acc > 0) g += `<text class="val" x="${x + bw / 2}" y="${y(acc) - 4}" text-anchor="middle">${fmt(acc)}</text>`;
    }
    g += `<text x="${x0 + slot / 2}" y="${H - 4}" text-anchor="middle">${lb}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function timeline(days, {big = false} = {}) {
  const W = 340, labW = big ? 0 : 40, rowH = big ? 34 : 20, gap = 6, top = 4, cw = W - labW - 4, H = top + days.length * (rowH + gap) + 14;
  const ev = allEvents(); let g = '';
  [0, 6, 12, 18, 24].forEach(hh => { const x = labW + cw * hh / 24; g += `<line class="grid" x1="${x}" x2="${x}" y1="${top}" y2="${H - 14}"/><text x="${x}" y="${H - 2}" text-anchor="${hh === 0 ? 'start' : hh === 24 ? 'end' : 'middle'}">${['12a','6a','12p','6p','12a'][hh / 6]}</text>`; });
  days.forEach((d0, i) => {
    const y0 = top + i * (rowH + gap), d1 = addDays(d0, 1), span = d1 - d0;
    g += `<rect x="${labW}" y="${y0}" width="${cw}" height="${rowH}" rx="4" fill="var(--surface-2)"/>`;
    if (!big) g += `<text x="0" y="${y0 + rowH / 2 + 3.5}">${fmtDate(d0, {weekday:'short'})} ${new Date(d0).getDate()}</text>`;
    for (const e of ev) {
      if (e.type === 'sleep') { const s = Math.max(e.at, d0), en = Math.min(e.at + (e.minutes || 0) * MIN, d1); if (en > s) g += `<rect x="${labW + cw * (s - d0) / span}" y="${y0}" width="${Math.max(1.5, cw * (en - s) / span)}" height="${rowH}" rx="3" fill="var(--sleep)"/>`; }
      else if (e.type === 'feed' && e.at >= d0 && e.at < d1) { const x = labW + cw * (e.at - d0) / span; g += `<rect x="${x - 1}" y="${y0 + rowH * 0.2}" width="3" height="${rowH * 0.6}" rx="1" fill="var(--feed)" stroke="var(--surface)" stroke-width="1"/>`; }
      else if (big && e.type === 'diaper' && e.at >= d0 && e.at < d1) { const x = labW + cw * (e.at - d0) / span; g += `<circle cx="${x}" cy="${y0 + rowH + 0.5}" r="2.6" fill="var(${e.dirty ? '--dirty' : '--wet'})"/>`; }
    }
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sleep and feeds by time of day">${g}</svg>`;
}

function renderTrends() {
  const el = $('#view-trends');
  const week = S.trendMode === 'week';
  const today = sod(Date.now());
  ensureMonthsBack(week ? addDays(S.trendEnd, -7) : addDays(S.trendDay, -7));
  let head = `<div class="trendbar"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Trends</h2><div class="seg" role="group" aria-label="Range"><button data-mode="day" aria-pressed="${!week}">Day</button><button data-mode="week" aria-pressed="${week}">Week</button></div></div>`;
  if (week) {
    const end = S.trendEnd, start = addDays(end, -6);
    head += `<div class="daynav"><button class="navbtn" data-tw="-7" aria-label="Previous week">‹</button><div class="lbl"><b>${end === today ? 'Last 7 days' : 'Week'}</b><span>${fmtDate(start, {month:'short', day:'numeric'})} – ${fmtDate(end, {month:'short', day:'numeric'})}</span></div><button class="navbtn" data-tw="7" aria-label="Next week" ${end >= today ? 'disabled' : ''}>›</button></div></div>`;
    const days = Array.from({length: 7}, (_, i) => addDays(start, i));
    const stats = days.map(d => rangeStats(d, addDays(d, 1)));
    const labels = days.map(d => d === today ? 'Today' : fmtDate(d, {weekday:'short'}));
    const fullDays = stats.some((s, i) => days[i] < today && hasData(s));
    const avgOf = f => { const xs = stats.filter((s, i) => (fullDays ? days[i] < today : days[i] <= today) && hasData(s)).map(f); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; };
    const volFmt = v => U.vol === 'oz' ? fmtN(v / ML_PER_OZ) : String(Math.round(v));
    const ints = stats.map(s => s.avgInterval);
    const card = (title, sum, body, legend = '') => `<div class="panel chart"><div class="hd"><h2>${title}</h2><span class="avg">${sum}</span></div>${body}${legend}</div>`;
    const lg = items => `<div class="legend">${items.map(([l, c]) => `<span style="--c:var(${c})"><i></i>${l}</span>`).join('')}</div>`;
    const aWet = avgOf(s => s.wet), aDirty = avgOf(s => s.dirty);
    el.innerHTML = head +
      card('Diapers', aWet != null ? `avg ${fmtN(aWet)} wet · ${fmtN(aDirty)} dirty / day` : '', barChart({labels, grouped: true, series: [{c:'--wet', values: stats.map(s => s.wet)}, {c:'--dirty', values: stats.map(s => s.dirty)}], fmt: v => String(v)}), lg([['Wet', '--wet'], ['Dirty', '--dirty']])) +
      card('Bottle & formula', avgOf(s => s.intakeMl) != null ? `avg ${fmtVol(avgOf(s => s.intakeMl))} / day` : '', barChart({labels, series: [{c:'--feed', values: stats.map(s => s.bottleMl)}, {c:'--formula', values: stats.map(s => s.formulaMl)}], fmt: volFmt, avg: avgOf(s => s.intakeMl)}), lg([[`Breast milk bottle (${volUnit()})`, '--feed'], [`Formula (${volUnit()})`, '--formula']])) +
      card('Breastfeeding', avgOf(s => s.breastMin) != null ? `avg ${fmtDur(avgOf(s => s.breastMin))} / day` : '', barChart({labels, series: [{c:'--feed', values: stats.map(s => s.breastMin)}], fmt: v => fmtN(v, 0), avg: avgOf(s => s.breastMin)}), `<div class="legend"><span>Minutes at the breast per day</span></div>`) +
      card('Feeds per day', avgOf(s => s.feeds) != null ? `avg ${fmtN(avgOf(s => s.feeds))} / day` : '', barChart({labels, series: [{c:'--feed', values: stats.map(s => s.feeds)}], fmt: v => String(v)})) +
      card('Time between feeds', (() => { const xs = ints.filter(x => x != null); return xs.length ? `avg ${fmtDur(xs.reduce((a, b) => a + b, 0) / xs.length)} · longest ${fmtDur(Math.max(...stats.map(s => s.longestGap || 0)))}` : ''; })(), barChart({labels, series: [{c:'--feed', values: ints.map(x => x == null ? 0 : x / 60)}], fmt: v => fmtDur(v * 60)}), `<div class="legend"><span>Average gap between the start of one feed and the next</span></div>`) +
      card('Sleep', avgOf(s => s.sleepMin) != null ? `avg ${fmtDur(avgOf(s => s.sleepMin))} / day` : '', barChart({labels, series: [{c:'--sleep', values: stats.map(s => s.sleepMin / 60)}], fmt: v => fmtN(v), avg: avgOf(s => s.sleepMin / 60)}) + `<div class="eyebrow" style="margin-top:6px">Sleep pattern</div>` + timeline(days), lg([['Hours asleep', '--sleep'], ['Feed', '--feed']])) +
      card('Tummy time', avgOf(s => s.tummyMin) != null ? `avg ${fmtDur(avgOf(s => s.tummyMin))} / day` : '', barChart({labels, series: [{c:'--tummy', values: stats.map(s => s.tummyMin)}], fmt: v => fmtN(v, 0)}), `<div class="legend"><span>Minutes per day</span></div>`) +
      card('Pumping', avgOf(s => s.pumpMl) != null ? `avg ${fmtVol(avgOf(s => s.pumpMl))} / day` : '', barChart({labels, series: [{c:'--pump', values: stats.map(s => s.pumpMl)}], fmt: volFmt}), `<div class="legend"><span>${U.vol === 'oz' ? 'Ounces' : 'Milliliters'} pumped per day</span></div>`) +
      card('Spit-ups', avgOf(s => s.spitups) != null ? `avg ${fmtN(avgOf(s => s.spitups))} / day · about ${fmtSpoons(avgOf(s => s.spitMl))}` : '', barChart({labels, series: [{c:'--spitup', values: stats.map(s => s.spitS)}, {c:'--diaper', values: stats.map(s => s.spitM)}, {c:'--visit', values: stats.map(s => s.spitL)}], fmt: v => String(v)}), lg([['Small', '--spitup'], ['Medium', '--diaper'], ['Large', '--visit']]) + `<div class="legend"><span>Count per day by size. Small is 1 teaspoon or less, medium up to 1 tablespoon, large more than a tablespoon.</span></div>`);
  } else {
    const d = S.trendDay, st = rangeStats(d, addDays(d, 1));

    const pa = f => prev.length ? prev.reduce((a, s) => a + (f(s) || 0), 0) / prev.length : null;
    head += `<div class="daynav"><button class="navbtn" data-td="-1" aria-label="Previous day">‹</button><div class="lbl"><b>${d === today ? 'Today' : fmtDate(d, {weekday:'long'})}</b><span>${fmtDate(d, {month:'long', day:'numeric'})}</span></div><button class="navbtn" data-td="1" aria-label="Next day" ${d >= today ? 'disabled' : ''}>›</button></div></div>`;
    const tile = (k, c, v, a) => `<div class="tile" style="--c:var(${c})"><div class="k"><i></i>${k}</div><div class="v num">${v}</div><div class="s num">${a != null ? 'prior 7-day avg ' + a : '&nbsp;'}</div></div>`;
    el.innerHTML = head + `<div class="tiles">
      ${tile('Wet diapers', '--wet', st.wet, prev.length ? fmtN(pa(s => s.wet)) : null)}
      ${tile('Dirty diapers', '--dirty', st.dirty, prev.length ? fmtN(pa(s => s.dirty)) : null)}
      ${tile('Feeds', '--feed', st.feeds, prev.length ? fmtN(pa(s => s.feeds)) : null)}
      ${tile('Bottle + formula', '--feed', fmtVol(st.intakeMl), prev.length ? fmtVol(pa(s => s.intakeMl)) : null)}
      ${tile('Breastfeeding', '--feed', fmtDur(st.breastMin), prev.length ? fmtDur(pa(s => s.breastMin)) : null)}
      ${tile('Avg time between feeds', '--feed', fmtDur(st.avgInterval), prev.length ? fmtDur(pa(s => s.avgInterval)) : null)}
      ${tile('Longest gap between feeds', '--feed', fmtDur(st.longestGap), null)}
      ${tile('Total sleep', '--sleep', fmtDur(st.sleepMin), prev.length ? fmtDur(pa(s => s.sleepMin)) : null)}
      ${tile('Longest sleep', '--sleep', fmtDur(st.longestSleep || null), prev.length ? fmtDur(pa(s => s.longestSleep)) : null)}
      ${tile('Tummy time', '--tummy', fmtDur(st.tummyMin), prev.length ? fmtDur(pa(s => s.tummyMin)) : null)}
      ${tile('Pumped', '--pump', fmtVol(st.pumpMl), prev.length ? fmtVol(pa(s => s.pumpMl)) : null)}
      ${tile('Naps & sleeps', '--sleep', st.sleeps, prev.length ? fmtN(pa(s => s.sleeps)) : null)}
      ${tile('Spit-ups', '--spitup', st.spitups + (st.spitL ? ` <span style="font-size:13px;color:var(--muted)">(${st.spitL} large)</span>` : ''), prev.length ? fmtN(pa(s => s.spitups)) : null)}
      ${tile('Spit-up amount (est.)', '--spitup', st.spitups ? `<span style="font-size:17px">about ${fmtSpoons(st.spitMl)}</span>` : '—', prev.length ? fmtSpoons(pa(s => s.spitMl)) : null)}
    </div>
    <div class="panel chart"><div class="hd"><h2>The day at a glance</h2></div>${timeline([d], {big: true})}<div class="legend"><span style="--c:var(--sleep)"><i></i>Asleep</span><span style="--c:var(--feed)"><i></i>Feed</span><span style="--c:var(--wet)"><i></i>Wet</span><span style="--c:var(--dirty)"><i></i>Dirty</span></div></div>`;
  }

const hasData = s => s.diapers || s.feeds || s.sleepMin || s.tummies || s.pumps || s.spitups;

/* WHO weight-for-age, boys, L/M/S by completed month 0–24 (CDC's copy of the WHO table). */
const WFA = [[0.3487,3.3464,0.14602],[0.2297,4.4709,0.13395],[0.197,5.5675,0.12385],[0.1738,6.3762,0.11727],[0.1553,7.0023,0.11316],[0.1395,7.5105,0.1108],[0.1257,7.934,0.10958],[0.1134,8.297,0.10902],[0.1021,8.6151,0.10882],[0.0917,8.9014,0.10881],[0.082,9.1649,0.10891],[0.073,9.4122,0.10906],[0.0644,9.6479,0.10925],[0.0563,9.8749,0.10949],[0.0487,10.0953,0.10976],[0.0413,10.3108,0.11007],[0.0343,10.5228,0.11041],[0.0275,10.7319,0.11079],[0.0211,10.9385,0.11119],[0.0148,11.143,0.11164],[0.0087,11.3462,0.11211],[0.0029,11.5486,0.11261],[-0.0028,11.7504,0.11314],[-0.0083,11.9514,0.11369],[-0.0137,12.1515,0.11426]];
/* WHO 1-month weight increments, boys: [from day, to day, 5th, 15th, 95th percentile gain in grams]. */
const WVEL = [[0,28,460,681,1509],[28,61,713,886,1724],[61,91,446,577,1228],[91,122,285,403,985],[122,152,194,311,883],[152,183,103,217,773],[183,213,42,154,706],[213,243,-1,111,671],[243,274,-36,77,646],[274,304,-66,48,627],[304,335,-89,27,623],[335,366,-106,15,635]];
const lmsAt = days => { const m = Math.max(0, Math.min(24, days / 30.4375)), i = Math.min(23, Math.floor(m)), f = m - i; return WFA[i].map((v, k) => v + (WFA[i + 1][k] - v) * f); };
const zOf = (g, days) => { const [L, M, s] = lmsAt(days); return (Math.pow(g / 1000 / M, L) - 1) / (L * s); };
const gAtZ = (z, days) => { const [L, M, s] = lmsAt(days); return 1000 * M * Math.pow(1 + L * s * z, 1 / L); };
const pctOf = z => { const x = Math.abs(z) / Math.SQRT2, t = 1 / (1 + 0.3275911 * x), y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x); return 50 * (1 + Math.sign(z) * y); };
const ordinal = n => n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : ({1:'st', 2:'nd', 3:'rd'}[n % 10] || 'th'));
const fmtPct = p => p < 1 ? 'below the 1st percentile' : p > 99 ? 'above the 99th percentile' : `${ordinal(Math.round(p))} percentile`;
const fmtGain = gpd => U.wt === 'metric' ? `${gpd >= 0 ? '+' : '−'}${Math.round(Math.abs(gpd))} g/day` : `${gpd >= 0 ? '+' : '−'}${fmtN(Math.abs(gpd) * 7 / G_PER_OZ)} oz/week`;
const birthTime = () => { const b = S.settings.birth; if (!b) return null; const t = new Date(b + 'T00:00').getTime(); return isFinite(t) ? t : null; };
const LV = {alert:3, watch:2, ok:1, info:0, none:0};
const LVW = {ok:'On track', watch:'Keep an eye', alert:'Call doctor', info:'For reference', none:'Not enough data'};
const LVC = {ok:'--ok', watch:'--watch', alert:'--alert', info:'--muted', none:'--muted'};
const HC_SOURCES = [
  ['AAP: Breastfeeding questions (diapers, stools, feeds, waking to feed)', 'https://www.healthychildren.org/English/tips-tools/symptom-checker/Pages/symptomviewer.aspx?symptom=Breast-Feeding+Questions'],

/* Best estimate of today's weight: a recent weigh-in, or an older one carried forward along his WHO percentile. */
function estWeight(now, bt) {
  const w = [...S.growth].reverse().find(x => x.grams && x.at <= now + MIN); if (!w) return null;
  const ago = (now - w.at) / DAY, wa = (w.at - bt) / DAY, A = (now - bt) / DAY;
  if (ago <= 7) return {g: w.grams, w, projected: false};
  if (ago <= 60 && wa >= 14) return {g: gAtZ(zOf(w.grams, wa), A), w, projected: true};
  return {g: null, w, stale: true};
}

function healthCheck() {
  const now = Date.now(), bt = birthTime();
  if (bt == null || bt > now) return {needs: 'birth'};
  const A = (now - bt) / DAY;  // days old (fractional)
  if (A > 366) return {tooOld: true};
  ensureMonthsBack(now - 9 * DAY);
  const ev = allEvents(); const first = ev.length ? ev[0].at : null;
  const loggedH = first == null ? 0 : (now - first) / HOUR;
  const full24 = loggedH >= 24;
  /* Longest stretch of the last 24 h with nothing logged (a logged sleep counts as covered; pumping doesn't). */
  const win0 = now - DAY, spans = [];
  for (const e of ev) { if (e.type === 'pump') continue; const en = e.type === 'sleep' ? e.at + (e.minutes || 0) * MIN : e.at; if (en >= win0 && e.at <= now) spans.push([Math.max(e.at, win0), Math.min(en, now)]); }
  spans.sort((a, b) => a[0] - b[0]);
  let cur = win0, hole = 0; for (const [a, b] of spans) { if (a > cur) hole = Math.max(hole, a - cur); cur = Math.max(cur, b); } hole = Math.max(hole, now - cur);
  const counted = full24 && hole <= (A < 122 ? 6 : 10) * HOUR;  // only colour counts when the day looks fully logged
  const st = rangeStats(now - DAY, now);
  const prior = []; for (let i = 1; i <= 7; i++) { const a = now - (i + 1) * DAY; if (first != null && a >= first) prior.push(rangeStats(a, a + DAY)); }
  const pAvg = f => prior.length >= 3 ? prior.reduce((s, x) => s + f(x), 0) / prior.length : null;
  const endOf = e => e.type === 'sleep' ? e.at + (e.minutes || 0) * MIN : e.at;
  const lastAny = ev.length ? Math.max(...ev.slice(-30).map(endOf)) : null;

  const lastWet = lastOf(e => e.type === 'diaper' && e.wet), lastDirty = lastOf(e => e.type === 'diaper' && e.dirty);
  const s3 = rangeStats(now - 3 * DAY, now);
  const formula = s3.formulaFeeds > s3.breastFeeds + s3.bottleFeeds;  // mostly formula vs mostly breast milk
  const est = estWeight(now, bt);
  const items = [];
  const add = (key, name, c, r) => items.push({key, name, c, ...r});
  const notYet = !full24 ? `Needs a full day of logging${first ? ` (you started ${fmtAgo(first)})` : ''}.` : `There's a ${fmtDur(hole / MIN)} stretch with nothing logged, so the counts may be short.`;
  const worst = rs => rs.reduce((a, r) => LV[r.lvl] >= LV[a.lvl] ? r : a, {lvl: 'none'});  // ties: the later, more specific reason wins

  {
    const val = full24 ? `${st.wet} in 24 h` : `${st.wet} so far`;

    let r;
    const wetFrom = lastWet ? lastWet.at : first;

    else if (dry > 8 && loggedH > 8 && fedSince && activeNow) r = {lvl:'watch', why:`No wet diaper logged in ${fmtDur(dry * 60)}. Check his diaper.`, more:'If he really has not peed in more than 8 hours, AAP says to call your pediatrician now (it can mean dehydration). After a long sleep, a change usually settles it.'};
    else if (!counted) r = {lvl:'none', why: notYet};
    else if (A < 4) { const need = Math.min(3, Math.floor(A) + 1); r = st.wet >= need ? {lvl:'ok', why:'Normal for the first days.'} : {lvl:'watch', why:`Fewer than ${need} in the last day.`}; r.more = 'While milk comes in (first 4 days), fewer wet diapers are normal; AAP says 3 a day can be normal. From day 5, look for 6 or more.'; }

    if (dol === 1) rs.push({lvl:'info', why:'First day. Poops pick up from day 2.'});
    else if (dol <= 4) {
      if (!counted) rs.push({lvl:'none', why: notYet});

    } else if (!formula && A < 28) {
      if (!counted) rs.push({lvl:'none', why: notYet});
      else if (st.dirty >= 3) rs.push({lvl:'ok', why:'3 or more a day is what AAP looks for in the first month.'});
      else if (st.dirty === 2) rs.push({lvl:'watch', why:'Below the 3 a day AAP looks for in the first month.', more:'For breast-milk-fed babies, AAP uses poops as the best sign of how much milk he is getting. Under 3 a day (after day 5) means call your pediatrician within 24 hours if it continues.'});

      else rs.push({lvl:'watch', why:'No poop in the last day.', more:'AAP: formula-fed babies usually poop 1–4 times a day until 2 months. One quiet day is not an emergency, but watch for hard stools or straining.'});

    else if (A < 28 && W >= 3) rs.push({lvl:'alert', why:`${W} watery poops in 24 h, under 1 month old.`, more:'AAP: under 1 month with 3 or more diarrhea stools in 24 hours, call your pediatrician now.'});
    else if (W >= 6) rs.push({lvl:'alert', why:`${W} watery poops in 24 h.`, more:'AAP: 6 or more watery stools in 24 hours, call your pediatrician within 24 hours.'});
    else if (W >= 3) rs.push({lvl:'watch', why:`${W} watery poops in 24 h counts as diarrhea.`, more:'AAP defines diarrhea as 3 or more watery or very loose stools. Watch wet diapers closely; call at 6 or more watery stools in 24 hours.'});

    const r = worst(rs); const moreAll = rs.filter(x => x.more && x !== r).map(x => x.more);

  /* Feeds per day: AAP 8–12 in the first month (breast milk), at least 8 for bottle-fed newborns. */
  {
    const val = full24 ? `${st.feeds} in 24 h${st.avgInterval ? ` · every ${fmtDur(st.avgInterval)}` : ''}` : `${st.feeds} so far`;
    let r;
    if (!counted) r = {lvl:'none', why: notYet};
    else if (A < 28 && !formula) r = st.feeds < 8 ? {lvl:'watch', why:'Below the 8–12 a day AAP expects in the first month.', more:'Breastfed newborns usually nurse 8–12 times in 24 hours. Fewer can mean he is not getting enough; watch his wet and dirty diapers.'}

  /* Longest stretch without a feed (first month): AAP says wake to feed after 3 h by day, 4 h at night. */
  if (A < 28) {

    else if (st.breastFeeds) r = {lvl:'info', why:'He also breastfed, so the bottle total is not everything he ate.', more:'With breastfeeds in the mix, wet and dirty diapers and weight gain are the better check.'};
    else if (A < 4) r = {lvl:'info', why:'Amounts ramp up fast in the first days. Follow your pediatrician\'s plan.', more:'AAP: newborns usually take 1–2 oz per feed after the first day or two.'};
    else if (A >= 183) r = st.intakeMl > 32 * ML_PER_OZ && counted ? {lvl:'watch', why:'Above the 32 oz a day AAP sets as the usual most.'} : {lvl:'info', why:'After 6 months solids change how much milk he needs.', more:'AAP: around 6 months, typically 6–8 oz at each of 4–5 feeds, and usually no more than 32 oz a day.'};

    else r = {lvl:'ok', why:`Close to AAP's 2½ oz per pound a day (about ${fmtVol(T)}).`, more:`Green band: ${fmtVol(lo)}–${fmtVol(hi)}, within about 20% of AAP's average, capped at the 32 oz AAP sets as the usual most.`};

  {

          else if (gpd > p95) rs.push({lvl:'watch', why:`Gaining fast: ${gainTxt} ${since}.`, more:`Faster than 95% of babies his age in the WHO growth standards (about ${fmtGain(p95)}). Usually fine; mention it at the next visit, especially if bottle totals run high.`});

  /* Spit-up: forceful under 12 weeks = call now (AAP); large ones and a rising count are worth watching. */
  {
    const rs = [];
    if (st.forceful && A < 84) rs.push({lvl:'alert', why:`Forceful spit-up under 12 weeks old.`, more:'AAP: under 12 weeks, if spitting up changes to forceful (projectile) vomiting, call your pediatrician now.'});
    else if (st.forceful >= 3) rs.push({lvl:'alert', why:`${st.forceful} forceful spit-ups in 24 h.`, more:'AAP: vomiting 3 or more times is a reason to call your pediatrician now.'});
    else if (st.forceful) rs.push({lvl:'watch', why:'Forceful spit-up in the last day.', more:'Watch whether it repeats. At 3 or more times, AAP says to call.'});
    if (st.spitL) rs.push({lvl:'watch', why:`${st.spitL} large spit-up${st.spitL === 1 ? '' : 's'} (more than a tablespoon).`, more:'AAP calls 1–2 mouthfuls normal. Big ones are worth watching, especially with fussiness, frequent crying or slow weight gain.'});
    const pa = pAvg(x => x.spitups);
    if (pa != null && st.spitups >= 2 * pa && st.spitups >= pa + 3) rs.push({lvl:'watch', why:`More than his usual (about ${fmtN(pa)} a day).`, more:'AAP: spitting up that keeps getting worse is worth raising with your pediatrician.'});
    if (!rs.length) rs.push(counted || st.spitups ? {lvl:'ok', why: st.spitups ? 'Normal amounts. About half of babies spit up.' : 'None logged.', more:'AAP: spit-up of 1–2 mouthfuls is normal and usually eases by about 7 months. Call right away for green or bloody spit-up.'} : {lvl:'none', why: notYet});
    const r = worst(rs);
    add('spit', 'Spit-up', '--spitup', {val: `${st.spitups}${full24 ? ' in 24 h' : ' so far'}${st.spitL ? ` · ${st.spitL} large` : ''}`, ...r, more: [r.more, ...rs.filter(x => x !== r).map(x => x.why)].filter(Boolean).join(' ')});
  }

  /* Sleep and tummy time: averages over the last 3 fully logged days. */
  {
    const t0 = sod(now), days = [];
    for (let i = 1; i <= 3; i++) { const d = addDays(t0, -i); if (first != null && d >= first) days.push(rangeStats(d, addDays(d, 1))); }
    const n = days.length, avg = f => n ? days.reduce((s, x) => s + f(x), 0) / n : null;
    const sl = avg(x => x.sleepMin), naps = days.filter(x => x.sleeps).length;
    let r;
    if (!n || !naps) r = {lvl:'none', why: n ? 'No sleep logged on recent full days.' : 'Needs a full day of logging.'};
    else if (A < 122) r = {lvl:'info', why:'No medical target under 4 months.', more:'The National Sleep Foundation says newborns often sleep 14–17 hours a day, but AAP and the sleep-medicine society give no target under 4 months. Logged sleep reads low if naps were missed.'};
    else if (sl / 60 >= 12 && sl / 60 <= 16) r = {lvl:'ok', why:'Within the 12–16 h a day recommended at 4–12 months.'};
    else r = {lvl:'watch', why:`${sl / 60 < 12 ? 'Below' : 'Above'} the 12–16 h a day recommended at 4–12 months.`, more:'AASM (endorsed by AAP): 12–16 hours per 24 including naps. If some naps did not get logged, this will read low.'};
    add('sleep', 'Sleep', '--sleep', {val: sl != null && naps ? `${fmtDur(sl)} / day` : '—', ...r, more: r.more ? r.more + ` Average of the last ${n} full day${n === 1 ? '' : 's'}.` : `Average of the last ${n} full day${n === 1 ? '' : 's'}.`});
    const tm = avg(x => x.tummyMin), ts = avg(x => x.tummies);
    let t;
    if (!n) t = {lvl:'none', why:'Needs a full day of logging.'};
    else if (A < 49) t = ts >= 2 ? {lvl:'ok', why:'At least 2 short sessions a day, as AAP suggests early on.'} : {lvl:'watch', why:'Fewer than 2 sessions a day.', more:'AAP: start with 2–3 short sessions (3–5 minutes) a day from the day he comes home, building up to 15–30 minutes a day by 7 weeks. Always with an awake adult watching.'};
    else t = tm >= 15 ? {lvl:'ok', why:'At least the 15–30 min a day AAP suggests by 7 weeks.'} : {lvl:'watch', why:'Under the 15–30 min a day AAP suggests by 7 weeks.', more:'Short sessions add up. Always with an awake adult watching.'};
    add('tummy', 'Tummy time', '--tummy', {val: n ? `${fmtDur(tm)} · ${fmtN(ts)}×/day` : '—', ...t, more: (t.more ? t.more + ' ' : '') + `Average of the last ${n} full day${n === 1 ? '' : 's'}.`});
  }
  return {items, A, est, full24, counted, quiet: lastAny != null && now - lastAny > 6 * HOUR ? now - lastAny : null};
}

function healthHTML() {
  const h = healthCheck(), nm = esc(babyName());
  const foot = `<div class="foot">A sanity check on what you've logged, using AAP, WHO and sleep-medicine guidance. It is not a diagnosis, and missed entries can make things look worse than they are. <b>Call right away, whatever this says, for a fever of 100.4°F (38°C) or more under 12 weeks, green or bloody spit-up, or if he is hard to wake, too weak to suck, or not drinking.</b>
    <details><summary>Where these numbers come from</summary><ul>${HC_SOURCES.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join('')}</ul></details></div>`;
  const wrap = inner => `<div class="panel hc">${inner}${foot}</div>`;
  if (h.needs) return wrap(`<div class="hd"><h2>How ${nm} is tracking</h2></div><p class="meta" style="margin:6px 0 10px">Add his birth date in Settings, so each check can use the right range for his age.</p><button class="btn" data-opensettings style="margin-bottom:12px">Open Settings</button>`);
  if (h.tooOld) return wrap(`<div class="hd"><h2>How ${nm} is tracking</h2></div><p class="meta" style="margin:6px 0 10px">These checks cover the first year. After that, your pediatrician's guidance is the better guide.</p>`);
  const its = h.items, nA = its.filter(i => i.lvl === 'alert'), nW = its.filter(i => i.lvl === 'watch'), nO = its.filter(i => i.lvl === 'ok');
  const verdict = nA.length ? ['--alert', `Call your pediatrician about: ${nA.map(i => i.name.toLowerCase()).join(', ')}`]
    : nW.length ? ['--watch', `${nW.length} thing${nW.length === 1 ? '' : 's'} to keep an eye on${nO.length ? `, ${nO.length} on track` : ''}`]
    : !h.full24 ? ['--muted', 'Still building up a day of logs. Most checks fill in after 24 hours.']
    : !h.counted ? ['--muted', 'Part of the last day has nothing logged, so the counts are left uncoloured.']
    : nO.length ? ['--ok', `Everything checked is on track`] : ['--muted', 'Not enough logged yet to check'];
  const ctx = [age(), h.est && h.est.g ? `weight ${h.est.projected ? 'about ' : ''}${fmtWeight(h.est.g)}` : 'no recent weight'].filter(Boolean).join(' · ');
  if (!S.hcOpen) S.hcOpen = new Set();
  const order = its.slice().sort((a, b) => LV[b.lvl] - LV[a.lvl]);
  return wrap(`<div class="hd"><h2>How ${nm} is tracking</h2><span class="meta">Last 24 hours</span></div>
    <div class="ctx">${esc(ctx)}</div>
    <div class="verdict" style="--lc:var(${verdict[0]})">${esc(verdict[1])}</div>
    ${h.quiet ? `<div class="meta" style="margin:4px 0">Nothing logged in the last ${fmtDur(h.quiet / MIN)}, so the counts may read low.</div>` : ''}
    ${order.map(i => `<details class="hr" data-hk="${i.key}" ${S.hcOpen.has(i.key) ? 'open' : ''} style="--lc:var(${LVC[i.lvl]})"><summary><span class="lvl">${LVW[i.lvl]}</span><span class="nm">${esc(i.name)}</span><span class="val num">${esc(i.val)}</span><span class="why">${esc(i.why)}</span></summary>${i.more ? `<div class="more"><p>${esc(i.more)}</p></div>` : ''}</details>`).join('')}`);
}

function renderVisit() {
  const el = $('#view-visit'); const now = Date.now();
  const s24 = rangeStats(now - DAY, now);
  const ev = allEvents(); const first = ev.length ? ev[0].at : now;
  const spanDays = Math.max(1, Math.min(7, (now - first) / DAY));
  const s7 = rangeStats(now - spanDays * DAY, now);
  const pd = x => x / spanDays;
  const g = S.growth.filter(x => x.grams); const lastG = g[g.length - 1], prevG = g[g.length - 2];
  const lastLen = [...S.growth].reverse().find(x => x.cm), lastHead = [...S.growth].reverse().find(x => x.headCm);
  let gain = '';
  if (lastG && prevG && lastG.at - prevG.at > DAY / 2) { const gd = (lastG.grams - prevG.grams) / ((lastG.at - prevG.at) / DAY); gain = ` · ${gd >= 0 ? '+' : '−'}${U.wt === 'metric' ? Math.round(Math.abs(gd)) + ' g' : fmtN(Math.abs(gd) / G_PER_OZ) + ' oz'}/day since ${fmtDate(prevG.at, {month:'short', day:'numeric'})}`; }
  const ld = lastOf(e => e.type === 'diaper' && e.dirty);
  const upcoming = S.visits.filter(v => v.at >= now - 3 * HOUR).sort((a, b) => a.at - b.at);
  const past = S.visits.filter(v => v.at < now - 3 * HOUR).sort((a, b) => b.at - a.at);
  const next = upcoming[0];
  const sec = (t, c) => `<tr class="sec" style="--c:var(${c})"><td colspan="3">${t}</td></tr>`;
  const tr = (k, a, b) => `<tr><td>${k}</td><td class="num">${a}</td><td class="num">${b}</td></tr>`;
  const dis = S.readOnly || S.mode === 'unavailable' ? 'disabled' : '';
  const qs = next ? (next.questions || []) : [];
  const qIn = $('#addqText'), qVal = qIn ? qIn.value : '', qFocus = qIn && document.activeElement === qIn;
  queueMicrotask(() => { const n = $('#addqText'); if (n && qVal) n.value = qVal; if (n && qFocus) n.focus(); });
  el.innerHTML = `
  <div class="panel vsum">
    <div class="h"><h2>For the pediatrician</h2><span class="asof">as of ${fmtDate(now, {month:'short', day:'numeric'})}, ${fmtTime(now)}</span></div>
    <div class="baby">${esc(babyName())}${age() ? ' · ' + age() : ''}${S.settings.birth ? ' · born ' + fmtDate(new Date(S.settings.birth + 'T00:00').getTime(), {month:'short', day:'numeric', year:'numeric'}) : ''}</div>
    <div class="growth">
      <div>${lastG ? `<b class="num">${fmtWeight(lastG.grams)}</b>` : 'Weight —'}${lastLen ? ` · <b class="num">${fmtLen(lastLen.cm)}</b> long` : ''}${lastHead ? ` · head <b class="num">${fmtLen(lastHead.headCm)}</b>` : ''}</div>
      <div class="sm">${lastG ? `Weighed ${fmtDate(lastG.at, {month:'short', day:'numeric'})}${esc(gain)}` : 'Log a weight with Growth on the Log tab'}</div>
    </div>
    <table class="vtable">
      <thead><tr><th></th><th>Last 24h</th><th>Avg/day${spanDays < 7 ? ` (${fmtN(spanDays, 0) || 1}d)` : ' (7d)'}</th></tr></thead>
      <tbody>
      ${sec('Feeding', '--feed')}
      ${tr('Feeds', s24.feeds, fmtN(pd(s7.feeds)))}
      ${tr('Bottle + formula', fmtVol(s24.intakeMl), fmtVol(pd(s7.intakeMl)))}
      ${tr('Breastfeeding', fmtDur(s24.breastMin), fmtDur(pd(s7.breastMin)))}
      ${tr('Time between feeds', fmtDur(s24.avgInterval), fmtDur(s7.avgInterval))}
      ${tr('Longest gap <span class="sm">(7d = max)</span>', fmtDur(s24.longestGap), fmtDur(s7.longestGap))}
      ${sec('Diapers', '--diaper')}
      ${tr('Wet', s24.wet, fmtN(pd(s7.wet)))}
      ${tr(`Dirty${ld ? ` <span class="sm">· last ${fmtAgo(ld.at)}</span>` : ''}`, s24.dirty, fmtN(pd(s7.dirty)))}
      ${sec('Sleep', '--sleep')}
      ${tr('Total sleep', fmtDur(s24.sleepMin), fmtDur(pd(s7.sleepMin)))}
      ${tr('Longest stretch <span class="sm">(7d = max)</span>', fmtDur(s24.longestSleep || null), fmtDur(s7.longestSleep || null))}
      ${sec('Other', '--tummy')}
      ${tr('Tummy time', fmtDur(s24.tummyMin), fmtDur(pd(s7.tummyMin)))}
      ${tr(`Spit-ups${s24.spitL || s24.forceful ? ` <span class="sm">· ${[s24.spitL && s24.spitL + ' large', s24.forceful && s24.forceful + ' forceful'].filter(Boolean).join(', ')}</span>` : ''}`, s24.spitups, fmtN(pd(s7.spitups)))}
      ${tr('Pumped', fmtVol(s24.pumpMl), fmtVol(pd(s7.pumpMl)))}
      </tbody>
    </table>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2>Questions to ask</h2>${next ? `<button class="linkbtn" data-editvisit="${esc(next._path)}">Edit visit</button>` : ''}</div>
    ${next ? `<div class="meta" style="margin:2px 0 8px">Next visit ${fmtDate(next.at, {weekday:'short', month:'short', day:'numeric'})}, ${fmtTime(next.at)}${next.place ? ' · ' + esc(next.place) : ''}</div>
      ${qs.length ? `<ul class="qlist">${qs.map((q, i) => `<li class="${q.done ? 'done' : ''}"><button class="ck" data-q="${i}" aria-label="${q.done ? 'Mark as not answered' : 'Mark as answered'}" ${dis}>${icon('check')}</button><span>${esc(q.text)}</span></li>`).join('')}</ul>` : `<div class="meta">No questions yet. Add them as they come up.</div>`}
      <form class="addq" id="addq"><input type="text" id="addqText" placeholder="Add a question" autocomplete="off" ${dis}><button class="btn" ${dis}>Add</button></form>`
    : `<div class="meta" style="margin:6px 0 10px">Schedule the next visit to start a list of questions for it.</div><button class="btn" data-add="visit" ${dis}>Add next visit</button>`}
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><h2>Visits</h2><button class="linkbtn" data-add="visit" ${dis}>+ Add visit</button></div>
    ${!S.visits.length ? `<div class="meta" style="margin-top:6px">No visits logged yet.</div>` : `<div class="list" style="margin-top:10px">${[...upcoming, ...past].map(v => `<button class="row" data-editvisit="${esc(v._path)}" style="--c:var(--visit)"><span class="dot">${icon('visit')}</span><span class="main"><span class="ttl">${v.at >= now - 3 * HOUR ? 'Upcoming' : 'Visit'}${v.place ? ' · ' + esc(v.place) : ''}</span>${v.notes ? `<div class="sub">${esc(v.notes.length > 140 ? v.notes.slice(0, 140) + '…' : v.notes)}</div>` : ''}<div class="sub">${(v.questions || []).length} question${(v.questions || []).length === 1 ? '' : 's'} · logged ${fmtDate(v.loggedAt, {month:'short', day:'numeric'})}${esc(byName(v.by))}</div></span><span class="when num">${fmtDate(v.at, {month:'short', day:'numeric'})}<div class="sub">${fmtTime(v.at)}</div></span></button>`).join('')}</div>`}
  </div>`;
  resolveNames([...new Set(S.visits.map(v => v.by).filter(Boolean))]);
}

function seedPreview(st) {

  /* localhost test switches: ?demo&age=20&feed=breast|formula|mixed&noweight&nobirth&few */
  const q = new URLSearchParams(location.search), AGE = q.has('age') ? +q.get('age') : 44, FEED = q.get('feed') || 'mixed';
  const bd = new Date(addDays(today, -AGE));
  if (!q.has('nobirth')) put('settings/main', {name: 'Sample baby', birth: `${bd.getFullYear()}-${pad(bd.getMonth() + 1)}-${pad(bd.getDate())}`, birthGrams: 3430});
  if (q.has('old1')) { put(`m/${monthKey(now - 30 * HOUR)}/events/only`, {type:'diaper', at:now - 30 * HOUR, loggedAt:now - 30 * HOUR, by:null, wet:true, dirty:true}); return; }

  if (q.has('dip')) { put('growth/b', {at:addDays(today, -AGE) + 9 * HOUR, loggedAt:addDays(today, -AGE) + 9 * HOUR, by:null, grams:3430}); put('growth/c', {at:addDays(today, -AGE + 22) + 9 * HOUR, loggedAt:addDays(today, -AGE + 22) + 9 * HOUR, by:null, grams:3600}); return; }
  if (q.has('few')) { put(`m/${monthKey(now)}/events/only`, {type:'diaper', at:now - 50 * MIN, loggedAt:now - 49 * MIN, by:null, wet:true, dirty:true}); return; }

      const method = FEED === 'mixed' ? (i % 3 === 0 ? 'breast' : i % 3 === 1 ? 'bottle' : 'formula') : FEED;
      const feed = {type:'feed', at:t, loggedAt:t + 4 * MIN, by:null, method};
      if (method === 'breast') { feed.minutes = Math.round(12 + R() * 14); feed.side = ['L','R','B'][i % 3]; } else feed.ml = Math.round(perFeedMl * (0.85 + R() * 0.3));
      put(`m/${monthKey(feed.loggedAt)}/events/f${day}-${i}`, feed);
      const dt = t + 25 * MIN; if (dt < now) put(`m/${monthKey(dt)}/events/d${day}-${i}`, {type:'diaper', at:dt, loggedAt:dt + MIN, by:null, wet:true, dirty:R() < 0.38});
      const night = new Date(t).getHours() >= 21 || new Date(t).getHours() < 5;
      const sl = Math.round(night ? 150 + R() * 90 : 45 + R() * 70); const ss = t + 40 * MIN;
      if (ss + sl * MIN < now) put(`m/${monthKey(ss)}/events/s${day}-${i}`, {type:'sleep', at:ss, loggedAt:ss + sl * MIN, by:null, minutes:sl});
      if (!night && i % 2 === 0 && t + 90 * MIN < now) put(`m/${monthKey(t)}/events/t${day}-${i}`, {type:'tummy', at:t + 70 * MIN, loggedAt:t + 80 * MIN, by:null, minutes:Math.round(4 + R() * 8)});
      if (method !== 'breast' && R() < 0.45 && t + 30 * MIN < now) put(`m/${monthKey(t)}/events/u${day}-${i}`, {type:'spitup', at:t + 20 * MIN, loggedAt:t + 22 * MIN, by:null, size: R() < 0.6 ? 'S' : R() < 0.8 ? 'M' : 'L', forceful:false});
      if (i % 3 === 1 && t + 60 * MIN < now) put(`m/${monthKey(t)}/events/p${day}-${i}`, {type:'pump', at:t + 50 * MIN, loggedAt:t + 70 * MIN, by:null, ml:Math.round((3 + R() * 2.5) * 2) / 2 * ML_PER_OZ, minutes:20});
      t += (night ? 3.6 : 2.6) * HOUR + R() * 50 * MIN; i++;
    }
  }
  if (!q.has('noweight')) [AGE, AGE - 14, AGE - 30, 3].filter((a, i, xs) => a >= 0 && a <= AGE && xs.indexOf(a) === i).forEach((ago, k) => {
    const a = AGE - ago; put(`growth/g${k}`, {at:addDays(today, -ago) + 10 * HOUR, loggedAt:addDays(today, -ago) + 11 * HOUR, by:null, grams:Math.round(wAt(a) * (q.has('sick') && ago === 3 ? 0.9 : 1))});
  });
  if (q.has('sick')) for (const [p, d] of [...st.docs]) {
    if (!p.startsWith('m/') || d.at < now - DAY) continue;
    if (d.type === 'diaper') { if (d.at > now - 11 * HOUR) d.wet = false, d.dirty = true; if (d.dirty) d.watery = true; }
    if (d.type === 'spitup') { d.forceful = true; d.size = 'L'; }
  }
  put('visits/v1', {at:addDays(today, -30) + 10 * HOUR, loggedAt:addDays(today, -31) + 20 * HOUR, by:null, place:'2-week checkup', notes:'Back above birth weight. Vitamin D drops daily.', questions:[{text:'Is spit-up after bottles normal?', done:true}]});
  put('visits/v2', {at:addDays(today, 6) + 10.5 * HOUR, loggedAt:now - 2 * DAY, by:null, place:'2-month checkup', notes:'', questions:[{text:'When should we expect a longer night stretch?', done:false}, {text:'How much formula per bottle at this age?', done:false}, {text:'Vaccine schedule for this visit', done:false}]});
}

boot();
})();
